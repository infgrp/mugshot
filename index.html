<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>졸업앨범 촬영용 슬레이트</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ─ 입력 화면 ─ */
        #input-screen {
            background: white;
            padding: 22px 28px 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 340px;
            width: 85%;
            box-sizing: border-box;
        }

        /* 탭 버튼 */
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 6px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            color: #6b7280;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tab-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }

        /* 입력 폼 */
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #4b5563;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 11px 12px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border 0.2s;
        }
        .input-group input:focus {
            border-color: #2563eb;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            padding: 13px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
            display: block;
        }
        .submit-btn:active { background-color: #1d4ed8; }

        /* ─ 공통 표시 화면 ─ */
        .display-screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #fff;
            color: #000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            text-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            padding: 20px;
            box-sizing: border-box;
        }
        .hint {
            position: absolute;
            bottom: 15px;
            font-size: 11px;
            color: #e0e0e0;
            font-weight: normal;
        }

        /* ─ 단체사진 슬레이트 ─ */
        #infoText {
            font-size: 23vw;
            line-height: 1.3;
            word-break: break-all;
            width: 100%;
        }
        #infoText div:last-child { font-size: 17vw; }
        @media (min-aspect-ratio: 1/1) {
            #infoText { font-size: 20vh; }
            #infoText div:last-child { font-size: 14vh; }
        }
        #infoText.long-text { font-size: 15vw; }
        #infoText.long-text div:last-child { font-size: 11vw; }
        @media (min-aspect-ratio: 1/1) {
            #infoText.long-text { font-size: 14vh; }
            #infoText.long-text div:last-child { font-size: 10vh; }
        }

        /* ─ 개인사진 슬레이트 ─ */
        .slate-wrap {
            width: 88%;
            box-sizing: border-box;
        }
        .slate-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .slate-left  { text-align: left; }
        .slate-right { text-align: right; }
        .slate-label {
            font-size: 10vw;
            font-weight: bold;
            color: #333;
            padding-bottom: 1.5vw;
        }
        .slate-hr {
            width: 100%;
            border: none;
            border-top: 0.6vw solid #000;
            margin: 0 0 2.5vw;
        }
        .slate-value {
            font-size: 15vw;
            line-height: 1.15;
        }
        @media (min-aspect-ratio: 1/1) {
            .slate-label { font-size: 11vh; padding-bottom: 1.2vh; }
            .slate-hr { border-top-width: 0.4vh; margin-bottom: 2vh; }
            .slate-value { font-size: 20vh; }
        }
    </style>
</head>
<body>

<div id="input-screen">
    <div class="tab-bar">
        <button class="tab-btn active" id="tab-individual" onclick="switchTab('individual')">개인사진</button>
        <button class="tab-btn" id="tab-group" onclick="switchTab('group')">단체사진</button>
    </div>

    <!-- 개인사진 입력 -->
    <div id="individual-inputs">
        <div class="input-group">
            <label for="iClassNum">반</label>
            <input type="number" id="iClassNum" inputmode="numeric" placeholder="예: 3">
        </div>
        <div class="input-group">
            <label for="iStudentNum">번호</label>
            <input type="number" id="iStudentNum" inputmode="numeric" placeholder="예: 5">
        </div>
        <div class="input-group">
            <label for="iName">이름</label>
            <input type="text" id="iName" placeholder="예: 김건우">
        </div>
        <button class="submit-btn" onclick="showIndividualSlate()">화면 크게 보기</button>
    </div>

    <!-- 단체사진 입력 -->
    <div id="group-inputs" style="display:none">
        <div class="input-group">
            <label for="classNum">반</label>
            <input type="number" id="classNum" inputmode="numeric" placeholder="예: 3">
        </div>
        <div class="input-group">
            <label for="groupNum">조 (없으면 비워두기)</label>
            <input type="number" id="groupNum" inputmode="numeric" placeholder="예: 2">
        </div>
        <div class="input-group">
            <label for="studentNum">번호 (여러 명 입력 가능)</label>
            <input type="text" id="studentNum" placeholder="예: 1, 2, 3 또는 5~8">
        </div>
        <button class="submit-btn" onclick="showSlate()">화면 크게 보기</button>
    </div>
</div>

<!-- 개인사진 표시 화면 -->
<div id="individual-screen" class="display-screen" onclick="showInput()">
    <div class="slate-wrap">
        <div class="slate-row">
            <div class="slate-left slate-label">반, 번호</div>
            <div class="slate-right slate-label">성&nbsp;&nbsp;명</div>
        </div>
        <hr class="slate-hr">
        <div class="slate-row">
            <div class="slate-left slate-value" id="slateNum"></div>
            <div class="slate-right slate-value" id="slateName"></div>
        </div>
    </div>
    <div class="hint">터치하면 수정 화면으로 돌아갑니다.</div>
</div>

<!-- 단체사진 표시 화면 -->
<div id="display-screen" class="display-screen" onclick="showInput()">
    <div id="infoText"></div>
    <div class="hint">터치하면 수정 화면으로 돌아갑니다.</div>
</div>

<script>
    function switchTab(mode) {
        const isIndividual = mode === 'individual';
        document.getElementById('individual-inputs').style.display = isIndividual ? 'block' : 'none';
        document.getElementById('group-inputs').style.display = isIndividual ? 'none' : 'block';
        document.getElementById('tab-individual').classList.toggle('active', isIndividual);
        document.getElementById('tab-group').classList.toggle('active', !isIndividual);
    }

    function showIndividualSlate() {
        const classNum = document.getElementById('iClassNum').value.trim();
        const studentNum = document.getElementById('iStudentNum').value.trim();
        const name = document.getElementById('iName').value.trim();
        if (!classNum || !studentNum || !name) {
            alert('반, 번호, 이름을 모두 입력해 주세요!');
            return;
        }
        const numCode = String(classNum).padStart(2, '0') + String(studentNum).padStart(2, '0');
        document.getElementById('slateNum').textContent = numCode;
        document.getElementById('slateName').textContent = name;
        document.getElementById('input-screen').style.display = 'none';
        document.getElementById('individual-screen').style.display = 'flex';
        requestFullscreen();
    }

    function showSlate() {
        const classNum = document.getElementById('classNum').value.trim();
        const groupNum = document.getElementById('groupNum').value.trim();
        let studentNum = document.getElementById('studentNum').value.trim();
        if (!classNum || !studentNum) {
            alert('반과 번호는 꼭 입력해 주세요!');
            return;
        }
        studentNum = studentNum.replace(/,\s*/g, ', ');
        let html = `<div>${classNum}반</div>`;
        if (groupNum) html += `<div>${groupNum}조</div>`;
        html += `<div>${studentNum}번</div>`;
        const el = document.getElementById('infoText');
        el.innerHTML = html;
        el.classList.toggle('long-text', studentNum.length > 8);
        document.getElementById('input-screen').style.display = 'none';
        document.getElementById('display-screen').style.display = 'flex';
        requestFullscreen();
    }

    function showInput() {
        document.getElementById('input-screen').style.display = 'block';
        document.getElementById('individual-screen').style.display = 'none';
        document.getElementById('display-screen').style.display = 'none';
        exitFullscreen();
    }

    function requestFullscreen() {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen().catch(() => {});
    }

    function exitFullscreen() {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen().catch(() => {});
        }
    }
</script>

</body>
</html>
